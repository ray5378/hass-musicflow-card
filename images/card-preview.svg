<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="320" rx="16" fill="#1f2430"/>
  <rect x="20" y="20" width="280" height="280" rx="12" fill="#2a3140"/>
  <!-- cover art placeholder -->
  <rect x="36" y="36" width="248" height="180" rx="8" fill="#39435a"/>
  <circle cx="160" cy="126" r="44" fill="#f6c945"/>
  <path d="M148 104 v44 l34 -22 z" fill="#1f2430"/>
  <!-- now playing text -->
  <text x="36" y="246" fill="#e6e9ef" font-size="18" font-weight="600">Song Title</text>
  <text x="36" y="270" fill="#9aa3b2" font-size="14">Artist · Album</text>
  <!-- progress bar -->
  <rect x="36" y="284" width="248" height="6" rx="3" fill="#3a4250"/>
  <rect x="36" y="284" width="120" height="6" rx="3" fill="#f6c945"/>
  <!-- controls on the right -->
  <g fill="#e6e9ef">
    <circle cx="380" cy="160" r="22" fill="#2a3140"/>
    <path d="M373 150 l18 10 -18 10 z" fill="#e6e9ef"/>
    <circle cx="450" cy="160" r="28" fill="#f6c945"/>
    <path d="M442 148 v24 l20 -12 z" fill="#1f2430"/>
    <circle cx="524" cy="160" r="22" fill="#2a3140"/>
    <path d="M531 150 l-18 10 18 10 z" fill="#e6e9ef"/>
  </g>
  <!-- peer chips -->
  <g font-size="13">
    <rect x="380" y="220" width="78" height="28" rx="14" fill="#2a3140"/>
    <text x="398" y="238" fill="#e6e9ef">Living Room</text>
    <rect x="470" y="220" width="64" height="28" rx="14" fill="#f6c945"/>
    <text x="486" y="238" fill="#1f2430">Kitchen</text>
  </g>
  <!-- heart / like -->
  <path d="M392 278 c-6 -8 -20 -4 -20 6 c0 8 20 16 20 16 c0 0 20 -8 20 -16 c0 -10 -14 -14 -20 -6 z" fill="#ff5c7a"/>
  <text x="412" y="290" fill="#9aa3b2" font-size="13">Like</text>
</svg>
