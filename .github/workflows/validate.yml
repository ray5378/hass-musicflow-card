name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    name: Build card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale or missing - run 'npm run build' and commit it.";
            exit 1;
          }
      - name: README must be valid UTF-8 (no BOM, decodes cleanly)
        # HACS 2.x renders README.md directly. A valid UTF-8 file with Chinese
        # displays fine (see banto6/haier). The real failure mode is a corrupted
        # encoding (non-UTF-8 bytes / stray BOM), which we reject here.
        run: |
          python3 - <<'EOF'
          import sys
          with open("README.md", "rb") as f:
              data = f.read()
          if data[:3] == b"\xef\xbb\xbf":
              print("README.md starts with a UTF-8 BOM - HACS/GitHub render it as a stray character. Remove the BOM.")
              sys.exit(1)
          try:
              data.decode("utf-8")
          except UnicodeDecodeError as e:
              print("README.md is not valid UTF-8 (HACS renders garbage / breaks parsing):", e)
              sys.exit(1)
          print("README.md is valid UTF-8")
          EOF
      - name: JSON files are valid
        run: |
          python3 -c "import json,glob; [json.load(open(f)) for f in glob.glob('*.json')]; print('json ok')"

  validate:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
