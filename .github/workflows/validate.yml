name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    name: Build card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale or missing - run 'npm run build' and commit it.";
            exit 1;
          }
      - name: README must be pure ASCII (HACS decodes docs as ASCII and drops everything else)
        run: |
          python3 - <<'EOF'
          import sys
          bad = []
          with open("README.md", "rb") as f:
              for i, line in enumerate(f, 1):
                  for ch in line.decode("utf-8"):
                      if ord(ch) > 127:
                          bad.append((i, ch))
          if bad:
              print("README.md contains non-ASCII characters - HACS strips them and the doc renders empty:")
              for i, ch in bad[:10]:
                  print(f"  line {i}: {ch!r}")
              sys.exit(1)
          print("README.md is pure ASCII")
          EOF
      - name: JSON files are valid
        run: |
          python3 -c "import json,glob; [json.load(open(f)) for f in glob.glob('*.json')]; print('json ok')"

  validate:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin

  no-v2-refs:
    name: 无遗留 V2 项目引用
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验无遗留 V2 项目引用
        run: |
          # 字符类写法(Music[Ff]low / music[Aa]flow)让本文件自身模式文本不被
          # git grep 命中,避免 CI 自检死循环。只拦「项目名层面的 V2 指向」,
          # 不动 ID3v2 / v2.0.0 / mfos_v2 等合法标识。
          if git grep -In -e "Music[Ff]low[-_]V2" -e "music[Aa]flow[-_]v2"; then
            echo "::error::发现遗留的 V2 项目引用,请移除后再提交。"
            exit 1
          fi
          echo "OK: 无 V2 项目引用。"
