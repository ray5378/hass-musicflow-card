name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v2.1.0 — 未播放态流动底色（idle ambient）

            ### 新功能
            - **未播放态不再是一片死灰**：没有封面可显示时（停止 / 清空队列 / 无媒体 / 未选播放器），
              卡片底色改由缓慢流动的低饱和光斑填充，替代原来的静态深紫灰渐变。
            - 与封面背景**严格互斥**：有封面就用封面主色（`.coverbg`），没封面才补流动底色，
              播放中的观感完全不变。
            - 文字/图标/进度条/选中态的强调色（`--acc`）同步落到底色同色系的柔色，不再突兀的纯白。

            ### 新增配置项（均可省略，默认即生效）
            | 配置 | 默认 | 说明 |
            |---|---|---|
            | `idle_background` | `true` | 关闭后回落到原来的深色渐变底 |
            | `idle_theme` | `auto` | `auto` 从 HA 主题 `--primary-color` 派生；也可固定 `twilight` / `ocean` / `ember` / `forest` / `mono` |
            | `idle_speed` | `normal` | `slow` / `normal` / `fast` / `off`（`off` = 静态底色，不动画） |

            ```yaml
            type: custom:musicflow-remote-card
            idle_theme: ocean
            idle_speed: slow
            ```

            ### 性能与无障碍
            - 只动画 `transform` / `opacity`，走合成线程，主线程零参与；不用 `filter` / JS 逐帧。
            - 卡片滚出视口、切到后台标签页、打开队列/媒体库面板时自动停表。
            - 系统开启「减弱动态效果」（`prefers-reduced-motion`）时降级为静态底色。
            - 三档光斑周期互质，合成周期约 8.6 小时，看不出循环。

            ### 其他
            - 修正版本号标识：`CARD_VERSION` 此前停留在 `1.8.0`，F12 Console 打印的版本与实际不符，
              现与 `package.json` 统一为 `2.1.0`。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 Ctrl+Shift+R 或 Lovelace「重新加载资源」清掉卡片缓存
            3. F12 Console 确认 `[musicflow-remote-card] v2.1.0`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
