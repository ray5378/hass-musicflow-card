name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v1.6.86 — 极简模式两处修正

            ### 修复
            1. **切歌不再退出极简模式**:v1.6.85 的修法在切歌瞬间(isPlaying 短暂 false 几十~几百毫秒)
               仍然被判成"暂停"而退出。加 **500ms 去抖**:短暂 false 让 mini 保持,
               持续 false 才是真暂停才退出。同时切歌恢复时(isPlaying false→true)撤销去抖。
            2. **回退歌词居中 + 标题封面下移**:
               - 上一版把歌词 `text-align: center` 让标题(左对齐)和歌词(居中)错位,
                 视觉"剧中了"。回退为左对齐,保持标题和歌词基线对齐。
               - 加 `padding-top: 24px`(原 14px),把标题和封面下移一点,不再贴顶。
               - 歌词盒高度 198 → 188px 适配新间距。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 Ctrl+Shift+R 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v1.6.86`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
