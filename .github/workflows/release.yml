name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      # 版本号**只从 tag 解析**,不用 github.ref_name 当版本号:
      # ref_name 在分支推送时等于 "main",直接拿它当版本会把分支名发成版本号。
      # 这里强制必须由 vX.Y.Z 数字 tag 触发,并二次校验三段数字。
      - name: Resolve version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::发布必须由数字版本 tag (vX.Y.Z) 触发,当前 ref=$GITHUB_REF(拒绝 main/分支名版本)"
            exit 1
          fi
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' 不是数字版本号(vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "::notice::本次发布版本 $tag"

      - name: Remove any pre-existing release for this tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::existing release for $RELEASE_TAG found - deleting it so the current notes are applied"
            gh release delete "$RELEASE_TAG" --yes
          else
            echo "no existing release for $RELEASE_TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            ## MusicFlow 卡片 ${{ steps.ver.outputs.tag }} — 群组勾选圈看得见了 + 点群组即切遥控

            本版修掉一个「点了群组却看不到圆圈、没法增减成员」的硬伤，并把群组的
            **遥控**与**成员管理**两条路径补齐：点群组 = 同时把遥控切到该群组 + 进入
            增减成员管理模式；挑成员不会动遥控状态。

            ### 修复：勾选圈隐形（静默退化）
            - 现象：点进群组后 DLNA / Sendspin 设备下方**看不到勾选圈**，只有已加入的
              设备能看见一个实心圆。
            - 根因：CSS 自定义属性是**字面量替换** —— `rgb(var(--x))` / `rgba(var(--x), a)`
              只接受 `r, g, b` 三元组，而 `--ctl` 的值是**完整色值**（`rgba(255,255,255,.85)`）。
              `border: 1.5px solid rgba(var(--ctl), .45)` 属**无效值**：CSS 不报错，只在
              计算值阶段把**整条 border** 作废（`border-style` 变 unset）⇒ 空心圈彻底隐形。
            - 修复：新增 `--ctl-rgb`（深色主题 `255,255,255` / 浅色主题 `20,20,24`，随
              明暗翻转），边框与底色改走它；圈放大到 22px / 2px 边框 / 半透明底。

            ### 本版改动
            - **圆圈自适应底色、亮眼**：底色会随封面强调色、待机渐变、浅深主题整体变化，
              所以圆圈自带对比度 —— 主题变量翻转取色 + 外圈一圈暗色阴影把圆从亮封面上
              「抠」出来；已加入态用 accent 实心 + 白色 ✓ + accent 光晕（三态里最亮），
              悬停放大 1.14x，键盘聚焦有焦点环，进场 0.26s 弹入（`prefers-reduced-motion`
              下静止）。
            - **点群组 = 切遥控 + 进管理模式**：以前点群组只冒出圆圈，遥控还挂在别的设备上
              ⇒ 「没办法选择遥控」。现在点群组即把遥控目标切到该群组，同时进入成员管理。
            - **勾选圈只改成员，不碰遥控**：挑成员时不会顺手把遥控状态切走。
            - **管理模式是临时浮层，有三条出口**：点空白处退出、10 秒无操作自动退出、
              再点一次该群组退出；管理态内每次操作都会重新计时（连着挑多个设备不会被打断）。
              退出后回到普通选中态，遥控目标不变。
            - 管理模式下方新增一行提示（中 / 英）：点设备下方圆圈加入 / 退出 · 点空白处或
              10 秒后自动退出。

            ### 工程：新增一类 UI 契约守卫
            - 新增 `tools/guard-card-ui.mjs` + `ui-guard.yml`（blocking，7 条规则）：拦截
              「完整色值塞进 `rgb()`/`rgba()`」这类**不报错的无效 CSS**，以及管理态的三条
              可用性契约（点群组切遥控、勾选圈不改遥控、有出口且操作重置计时）。
              已做变异验证：每条修复改回 bug 形态，对应用例逐条转红。
            - 该 job **故意不构建**：`dist` 入仓，校验的是**已提交产物** —— 只在 `src` 修了
              忘记 `npm run build` 也会判红。

            ### 影响面
            - 纯卡片前端改动，**服务端 / HA 集成 / 客户端无需配合升级**。
            - 群组成员接口需要服务端 ≥ v4.0.16。

            ### 升级步骤
            1. HACS 中更新本卡片（或手动替换 `dist/hass-musicflow-card.js`）
            2. 浏览器 `Ctrl+Shift+R`，或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v${{ steps.ver.outputs.ver }}`
          draft: false
          prerelease: false
