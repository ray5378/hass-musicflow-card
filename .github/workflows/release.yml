name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Remove any pre-existing release for this tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::notice::existing release for ${{ github.ref_name }} found - deleting it so the current notes are applied"
            gh release delete "${{ github.ref_name }}" --yes
          else
            echo "no existing release for ${{ github.ref_name }}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v2.4.0 — 卡片播放器列表接入 MusicFlow 客户端本机实例

            ### 新增
            - 卡片的「播放器」列表现在包含 **MusicFlow 客户端本机实例**（安卓 / Windows，`kind==="local"` 且非 web 平台），
              与既有的 DLNA / AirPlay / Sendspin 设备并列显示与控制。
            - 客户端本机实例用 **手机 / 显示器图标** 区分平台（安卓=手机、Windows=显示器），DLNA 设备仍用音箱图标；
              列表项在缺省名时回退为「本机」/「MusicFlow 客户端」/「播放设备」。
            - 服务端 `decoratePeersForClient` 已对其它端隐藏 `web` 行（Web 不再作为被遥控目标），
              卡片侧再以 `platform !== "web"` 保险一次；`group` 暂不在卡片播放器列表展示。
            - 客户端本机实例起播 / 换曲时，卡片空闲（未选播放器）或正看离线设备时**自动跟随显示**，
              语义与 DLNA 的 `_maybeFollowDevice` 一致，不打扰正在看的在线设备。

            ### 修复 / 加固
            - **取消卡片对远端客户端 peer 的保活心跳**：卡片是「控制器」而非「播放器」，
              原先的 `heartbeat(local:)` 分支会让已离线的客户端被错误标记为在线
              （此前 local 不被列表收纳，该分支是死代码；现在会真实触发，已移除）。
            - 客户端本机实例的状态 / 队列仍走既有的 `getStatus` 轮询 + `peer_queue_changed` 推送，无需额外事件。

            ### 兼容性
            - 与 **MusicFlow 服务端 v3.0.18+** 及 **客户端 v5.0.1+** 配套使用最佳；
              旧版服务端仍只回 DLNA 类设备时，本卡片行为与 v2.3.9 完全一致。
            - `rest` 降级、心跳重连、透明全屏面板「不停表」等既有行为未改动。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 `Ctrl+Shift+R` 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v2.4.0`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
