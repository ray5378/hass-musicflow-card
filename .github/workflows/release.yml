name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      # 版本号**只从 tag 解析**,不用 github.ref_name 当版本号:
      # ref_name 在分支推送时等于 "main",直接拿它当版本会把分支名发成版本号。
      # 这里强制必须由 vX.Y.Z 数字 tag 触发,并二次校验三段数字。
      - name: Resolve version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::发布必须由数字版本 tag (vX.Y.Z) 触发,当前 ref=$GITHUB_REF(拒绝 main/分支名版本)"
            exit 1
          fi
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' 不是数字版本号(vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "::notice::本次发布版本 $tag"

      - name: Remove any pre-existing release for this tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::existing release for $RELEASE_TAG found - deleting it so the current notes are applied"
            gh release delete "$RELEASE_TAG" --yes
          else
            echo "no existing release for $RELEASE_TAG"
          fi

      # 发布说明**按 tag 取文件**,不再写死在 workflow 里。
      # 写死内容的旧做法会让每个新 tag 都复述上一版的功能,发布页与实际改动不符。
      - name: Compose release notes
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          mkdir -p .release
          if [ -f "docs/releases/$TAG.md" ]; then
            cp "docs/releases/$TAG.md" .release/body.md
            echo "::notice::release notes from docs/releases/$TAG.md"
          else
            printf '## MusicFlow 卡片 %s\n\n本版变更详见提交记录。\n' "$TAG" > .release/body.md
            echo "::warning::docs/releases/$TAG.md 不存在,使用通用发布说明"
          fi
          {
            echo
            echo "### 升级步骤"
            echo '1. HACS 中更新本卡片（或手动替换 `dist/hass-musicflow-card.js`）'
            echo '2. 浏览器 `Ctrl+Shift+R`，或 Lovelace「重新加载资源」'
            echo "3. F12 Console 确认 \`[musicflow-remote-card] v$VER\`"
          } >> .release/body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: .release/body.md
          draft: false
          prerelease: false
