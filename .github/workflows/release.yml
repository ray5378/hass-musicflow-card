name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v1.6.84 — 极简歌词模式版式重做

            收到实测反馈后重做极简模式版式:之前用 `visibility:hidden` 让切换器/控件占位,
            导致歌词只能从卡片中部开始、顶部空一大块(看起来"整体下移 + 偏左")。

            本次改为真正移除占位,歌词接管整卡高度,并**按你的要求去掉极简模式的进度条**。

            ### 新版极简模式
            - 切换器(.outputs)、播放控件行(.controls)、进度条(.progress-row)在极简模式下
              `display:none` 完全移除,不再占位
            - 歌词视口 100px → **198px**(约 9~10 行),从标题下沿一路铺到卡底,当前行中段居中
            - 保留:曲名 + 封面;移除:进度条(极简模式不再显示时间/进度)
            - 卡片高度靠 `min-height` 与完整模式保持恒等(250px)
            - 唤出:鼠标移入 / 点击 / 触屏点按 / 键盘焦点进入,立即恢复完整模式

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 Ctrl+Shift+R 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v1.6.84`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
