name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v2.3.0 — 未播放态底色改为「5 组配色轮换 + 呼吸」雪碧条方案

            ### 变更
            - 未播放态（无封面）底色由旧的 3 光斑漂移 / 取封面色流动光晕，改为**「5 组配色轮换 + 呼吸」雪碧条**：
              一张 5 格横条，`background-position` 平移换格，叠加一层 `transform` / `opacity` 呼吸光晕。
            - 全程只动合成属性（`background-position` / `transform` / `opacity`），**Paint / Raster / Layout 均为 0 次**，
              主线程零参与，多卡稳态无压力。

            ### 兼容性 / 配置语义
            - `idle_background` / `idle_theme` / `idle_speed` 名称与取值不变；`idle_theme` 的 6 个预设
              （`auto` + `twilight` / `ocean` / `ember` / `forest` / `mono`）全部保留，改为只固定色相。
            - **`idle_speed` 语义变了**：同时驱动呼吸与换色。`off` 档由「仍有 3 个光斑可见」改为「静止在首组配色」——
              升级后如觉得静止观感变化，属预期。
            - 换色节奏：一轮 `slow` 32s / `normal` 20s / `fast` 12s（`off` 静态）。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 `Ctrl+Shift+R` 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v2.3.0`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
