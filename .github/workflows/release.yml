name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v1.6.89 — 极简模式歌词底部多显示一行

            ### 修复
            - 极简模式歌词视口 188px → **208px**,底部多显示一行(约 10 行可视)
            - 同步把上下渐隐从 16% 收窄到 10%,多出的那一行保持可读
              (当前行仍在第 5 槽,位置不变,只是底部多预览一行)

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 Ctrl+Shift+R 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v1.6.89`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
