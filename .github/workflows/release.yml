name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v2.3.7 — idle 配色环起点改为「红」

            ### 变更
            - **配色环的起点旋转到「红」**：轮换顺序现为
              红 → 青绿 → 橙 → 湖青 → 黄 → 靛蓝 → 暖褐 → 藤紫 → 松墨 → 品红 → 草绿 → 烟灰 →(回红)。
            - **起点只决定「首屏色」，对观感节奏零影响**：环是循环的，旋转起点不改变任何一段相邻
              ΔE —— 12 段的 ΣΔE 恒为 1005、相邻最小 ΔE 恒为 **65.7**（已用 `tools/palette/check.cjs`
              复核）。所以这次只改变「首次进入未播放态时第一眼看到哪个颜色」。
            - 起点取红，因为它在这条环上彩度最高、色相最正（C\*=63 / h=29°），开场辨识度最高。
            - **12 组色值一个都没动**：亮度定标（峰 `.175` / `.140` / `.110` / `.085` / 谷 `.070`，
              峰谷 1.88×）与关键帧推导（`50/N %` 停留窗、底层漏出 0%）都保持 v2.3.6 的状态。
            - 动效本身不变：仍是整卡对角渐变、原地交叉淡入（`mf-cyc` + 负 `animation-delay`
              错峰），只动 `opacity`，无位移、无重绘、无滤镜。

            ### 兼容性
            - 白字在最亮配色组上的对比度仍为 **4.67:1**（过 WCAG AA 4.5:1），idle 态依旧是
              「暗底浅字」，不会读不清。
            - `idle_background` / `idle_theme` / `idle_speed` 名称与取值不变，无需改配置。
            - `idle_speed` 仍是 `slow` 11.2s / `normal` 7s / `fast` 4.2s（一轮 89.6 / 56 / 33.6s）；
              `idle_theme` 仍**只**决定强调色（图标 / 进度条 / 选中态）色相，不影响底色。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 `Ctrl+Shift+R` 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v2.3.7`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
