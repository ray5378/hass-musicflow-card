name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v2.3.3 — idle 轮换提速：每组停留 2s

            ### 变更
            - 未播放态底色的轮换节奏再次加快：**每组配色停留 2s**（一轮 10s）。
            - `idle_speed` 语义不变（缩放「每组停留秒数」），各档位等比缩小：
              `slow` 3.2s / `normal` 2s / `fast` 1.2s（一轮 16s / 10s / 6s）；`off` 仍静止在首组配色。
            - 动效本身不变：仍是 5 层固定配色整卡对角渐变、原地交叉淡入（A+ 方案）。
              交叉淡入窗口与「停留时长」的比例（各占一轮的 10%）随周期等比缩放，
              所以提速后观感与之前一致，只是整体节奏更快。

            ### 兼容性
            - `idle_background` / `idle_theme` / `idle_speed` 名称与取值不变，无需改配置；
              觉得太快可在卡片配置里设 `idle_speed: slow`（3.2s/组）。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 `Ctrl+Shift+R` 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v2.3.3`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
