name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Remove any pre-existing release for this tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::notice::existing release for ${{ github.ref_name }} found - deleting it so the current notes are applied"
            gh release delete "${{ github.ref_name }}" --yes
          else
            echo "no existing release for ${{ github.ref_name }}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v2.3.8 — 配色命名对齐（深红 / 焦橙 / 暗金）+ 发版流程自愈

            ### 变更
            - **除版本号外无运行时行为变更**：12 组色值、环顺序（环上相邻最小 Lab ΔE 恒为 **65.7**）、
              亮度定标（峰 `.175` / `.140` / `.110` / `.085` / 谷 `.070`，峰谷 **1.88×**）、
              关键帧推导（`50/N %` 停留窗，底层漏出 0%）与轮换节奏（`normal` 每组 7s）
              **全部与 v2.3.7 一致**。
            - **配色命名统一为 深红 / 焦橙 / 暗金**：这三组此前在文档里写作 红 / 橙 / 黄。
              新名直接采用它们实际的色相名，命名与观感一致；README（中 / 英）与源码注释同步。
              **色值本身一个都没动。**
            - **发版流程自愈（仅影响本仓库维护者）**：发布 workflow 在创建 Release 前会先删除同名
              旧 Release，从而保证 tag 重推 / 重跑时 release notes 一定被刷新（此前会被旧 notes 顶住）。

            ### 注意（设计取舍，非 bug）
            - 深红 / 焦橙 / 暗金 受「暗底 + 白字」约束：相对亮度上限 ≈0.183，再亮白字对比度就跌破
              WCAG AA。所以这三组只能压到这个深度，不是明亮原色。想更鲜艳必须先牺牲文字可读性。

            ### 兼容性
            - 白字在最亮配色组上的对比度仍为 **4.67:1**（过 WCAG AA 4.5:1），idle 态依旧是
              「暗底浅字」，不会读不清。
            - `idle_background` / `idle_theme` / `idle_speed` 名称与取值不变，无需改配置。
            - `idle_speed` 仍是 `slow` 11.2s / `normal` 7s / `fast` 4.2s（一轮 89.6 / 56 / 33.6s）；
              `idle_theme` 仍**只**决定强调色（图标 / 进度条 / 选中态）色相，不影响底色。
            - 关键帧由 JS 注入：若你自定义过卡片样式里写死的 `mf-cyc`，请删掉以免覆盖。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 `Ctrl+Shift+R` 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v2.3.8`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
