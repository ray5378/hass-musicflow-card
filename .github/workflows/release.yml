name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Remove any pre-existing release for this tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::notice::existing release for ${{ github.ref_name }} found - deleting it so the current notes are applied"
            gh release delete "${{ github.ref_name }}" --yes
          else
            echo "no existing release for ${{ github.ref_name }}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }} — lockstep 对齐发布(配套服务端 v4.0.6)

            本版**无功能变更**,仅做版本号对齐:让「集成 / 卡片 / 服务端 / 客户端」四个
            关联仓库的发布批次可追溯。卡片行为与 v2.4.4 完全一致。

            ### 配套
            - **MusicFlow 服务端 v4.0.6+**:进度条跳转(sendspin / DLNA)按 Music Assistant
              语义重做 —— seek 由「在跑着的流里挪指针」改为「用新起点重建一条流」,
              sendspin 跳转后的断流卡顿与「进度条比真实时间快」随之消失;ffmpeg 孤儿
              泄漏根治;AirPlay 取流通道从 DLNA 路由中独立。
            - **MusicFlow 客户端 v5.0.22+**:本机播放拖动进度条不再「拖到哪都从头开始」。
            - 卡片侧读取位置 / 拖动去抖(250ms trailing)逻辑未变,无需重新配置。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 `Ctrl+Shift+R` 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v2.4.5`
          draft: false
          prerelease: false
