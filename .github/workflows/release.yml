name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      # 版本号**只从 tag 解析**,不用 github.ref_name 当版本号:
      # ref_name 在分支推送时等于 "main",直接拿它当版本会把分支名发成版本号。
      # 这里强制必须由 vX.Y.Z 数字 tag 触发,并二次校验三段数字。
      - name: Resolve version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::发布必须由数字版本 tag (vX.Y.Z) 触发,当前 ref=$GITHUB_REF(拒绝 main/分支名版本)"
            exit 1
          fi
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' 不是数字版本号(vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "::notice::本次发布版本 $tag"

      - name: Remove any pre-existing release for this tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::existing release for $RELEASE_TAG found - deleting it so the current notes are applied"
            gh release delete "$RELEASE_TAG" --yes
          else
            echo "no existing release for $RELEASE_TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            ## MusicFlow 卡片 ${{ steps.ver.outputs.tag }} — 选中群组刷新后不再跳回独立播放器

            本版修掉一个持久化缺失：在卡片里选中某个**群组**作为遥控目标后，
            **刷新页面必然跳回独立播放器**，之前选的群组丢失。

            ### 修复：选中目标不持久化（刷新即丢）
            - 现象：卡片里点选群组 → 一切正常；一刷新（F5 / HA 重新加载资源 /
              面板切换重挂载），遥控目标自动回到本机（独立播放器），群组选择消失。
            - 根因：卡片**从不持久化选中的遥控目标**（`currentPeerId` 无 localStorage）。
              刷新后归 `""`，`_applyPeerSnapshot` 在无显式默认（`pinned`，来自卡片配置
              `entity.peer_id`）时走 `list.find(p => p.available)`，而展示序
              `local(0) > group(1) > 独立播放器(2)`，`find` 第一个就是本机
              ⇒ 每次刷新自动选中独立播放器。
            - 修复：
              - `_selectPeer` 选中时把 `peerId` 写入 `localStorage`（有 `entity` 配置按
                `musicflow-remote-peer:<entity>` 分桶，无配置用通用 key）；只写有效选择、
                不写空（离线清空时保留上次值）。
              - `_applyPeerSnapshot` 首次进来**一次性**从 localStorage 恢复上次选中的 peer，
                **仅当该 peer 仍在本次快照里**；若被删 / 离线移除则清空、交回自动选逻辑。
              - 显式默认（`pinned`，`entity.peer_id`）仍优先于 localStorage 恢复。
              - 新增 `_peerRestoreDone` 标志，避免 HA 面板切换导致 detach / attach
                重挂载时重复恢复。
              - 未改动排序与群组点击逻辑 ⇒ 守卫不受影响。

            ### 影响面
            - 纯卡片前端改动，**服务端 / HA 集成 / 客户端无需配合升级**。
            - 群组成员接口仍需要服务端 ≥ v4.0.16（上版已满足）。

            ### 升级步骤
            1. HACS 中更新本卡片（或手动替换 `dist/hass-musicflow-card.js`）
            2. 浏览器 `Ctrl+Shift+R`，或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v${{ steps.ver.outputs.ver }}`
          draft: false
          prerelease: false
