name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v2.3.6 — idle 配色扩容到 12 组 + 环序 Lab ΔE 优化 + 关键帧随层数推导

            ### 变更
            - **配色由 8 组扩到 12 组**，新增 品红 / 草绿 / 烟灰 / 青绿：
              品红 `#ad3a92`/`#a43a6b`、草绿 `#3a841f`/`#4e7720`、烟灰 `#4f535a`/`#4b4c54`、
              青绿 `#197566`/`#216a7c`（红 / 黄 / 橙 / 靛蓝 / 暖褐 / 湖青 / 藤紫 / 松墨 保留）。
            - **顺序是固定的环，不随机**：代码里没有任何随机数，永远按
              品红 → 草绿 → 烟灰 → 红 → 青绿 → 橙 → 湖青 → 黄 → 靛蓝 → 暖褐 → 藤紫 → 松墨 循环。
            - **环序改用 Lab ΔE 直接优化**（max-min 判据），相邻两组最小 **ΔE = 65.7** ——
              每换一组都是肉眼明确的跳变。判「像不像」的口径是 ΔE*ab 而非色相差。
            - **微调 3 个低彩度色**：初版「松墨 vs 青绿」只有 ΔE 15~17，把松墨挪到 125°（真·墨绿）、
              青绿提彩度到 65% 并挪到 170°、暖褐降饱和，三者最近邻距离由 15/20/21 拉到 27/27/24。
              全表最像的一对是「暖褐 vs 橙」（ΔE 24.4），环上不相邻。
            - **关键帧改为随层数推导**（`50/N %` 停留窗），不再写死。写死的 0~10% 窗口只对 5 层成立，
              12 层时会 3~4 层同时半透明、主导色权重掉到 ~45% 而发糊。N=12 时注入
              `{0%,4.167%→1; 8.333%,95.833%→0; 100%→1}`；底层漏出由 N=8 的 1.56% 降到 **0%**。
            - 亮度仍按**相对亮度 Y** 定标：峰 `.175`（草绿/湖青/靛蓝）/ `.140`（品红/青绿/橙/黄）/
              `.110`（红/暖褐/藤紫）/ `.085`（烟灰）/ 谷 `.070`（松墨），峰值→谷底 **1.88×**。
            - 轮换节奏保持每组停留 **7s**（一轮 56s）：`slow` 11.2s / `normal` 7s / `fast` 4.2s
              （一轮 89.6s / 56s / 33.6s）；`off` 仍静止在首组配色。
            - 动效本身不变：仍是整卡对角渐变、原地交叉淡入（`mf-cyc` + 负 `animation-delay`
              错峰），只动 `opacity`，无位移、无重绘、无滤镜。

            ### 注意（设计取舍，非 bug）
            - 红 / 黄 / 橙 受「暗底 + 白字」约束：相对亮度上限 ≈0.183，再亮白字对比度就跌破
              WCAG AA。所以它们呈现为**深红 / 焦橙 / 暗金**，不是明亮原色。
              想更鲜艳必须先牺牲文字可读性。

            ### 兼容性
            - 白字在最亮配色组上的对比度仍有 **4.67:1**（过 WCAG AA 4.5:1），
              idle 态依旧是「暗底浅字」，不会读不清。
            - `idle_background` / `idle_theme` / `idle_speed` 名称与取值不变，无需改配置。
            - `idle_theme` 仍**只**决定强调色（图标 / 进度条 / 选中态）色相，不影响底色。
            - 关键帧由 JS 注入：若你自定义过卡片样式里写死的 `mf-cyc`，请删掉以免覆盖。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 `Ctrl+Shift+R` 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v2.3.6`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
