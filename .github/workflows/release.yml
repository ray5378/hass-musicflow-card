name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v1.6.88 — 极简模式封面左移 6px

            ### 修复
            - 极简模式下封面左移 6px(`margin-right: 6px`):右缘距卡边 14→20px,
              与左侧 20px 内边距(标题/歌词)左右对称。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 Ctrl+Shift+R 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v1.6.88`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
