name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      # 版本号**只从 tag 解析**,不用 github.ref_name 当版本号:
      # ref_name 在分支推送时等于 "main",直接拿它当版本会把分支名发成版本号。
      # 这里强制必须由 vX.Y.Z 数字 tag 触发,并二次校验三段数字。
      - name: Resolve version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::发布必须由数字版本 tag (vX.Y.Z) 触发,当前 ref=$GITHUB_REF(拒绝 main/分支名版本)"
            exit 1
          fi
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' 不是数字版本号(vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "::notice::本次发布版本 $tag"

      - name: Remove any pre-existing release for this tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::existing release for $RELEASE_TAG found - deleting it so the current notes are applied"
            gh release delete "$RELEASE_TAG" --yes
          else
            echo "no existing release for $RELEASE_TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            ## MusicFlow 卡片 ${{ steps.ver.outputs.tag }} — 播放器群组可在卡片里直接遥控与增减成员

            本版把**播放器群组**接进卡片的播放器列表：点群组即进入管理模式，每个设备行下方
            出现勾选小圆圈，点一下即加入 / 退出该群组 —— 与 Web 端、MusicFlow 客户端
            完全一致的交互口径。

            ### 本版改动
            - **群组进播放器列表**：群组是「容器」型播放器 —— 成员全离线、甚至空组也不再从
              列表里剪掉（否则管理模式入口消失，空组根本没法加成员）。
            - **勾选圈加入 / 退出**：点群组进入管理模式后，DLNA / Sendspin 设备行下方出现
              20px 勾选圈（组内 = accent 实心 + 白色 ✓，组外 = 空心圈），点击即调
              `POST /v1/groups/:id/members {add,remove}`（幂等原子口）；
              成员键按命名空间书写：`sendspin:<clientId>` / DLNA 裸 id。
            - **展示序与 Web / 客户端统一**：正在播的排前面；同为在播或同为闲置时按
              「客户端本机 > 群组 > 独立播放器」，再按名称。
            - 新增 i18n `outputs.groupJoin` / `outputs.groupLeave`（中 / 英）。

            ### 工程与发布链
            - 新增**版本号守卫** `tools/check-version-guard.mjs` + `version-guard.yml`：
              版本号必须是数字（vX.Y.Z），`main` / `master` / `latest` 等分支名一律判红；
              并静态禁止把 `github.ref_name` 当版本号（推分支时它等于 `main`）。
              监听 `tags: ["*"]` —— 只听 `v*` 的话，误打的 `main` tag 根本不会触发检查。
            - **移除 HACS validation**：`hacs/action` 只认 main 分支版本，与「拒绝 main
              版本发布」直接冲突，永久不再启用；发布改为纯 **v\* tag** 体系。
            - seek 契约守卫修复：dist 侧不再钉死压缩后的参数名（新增类方法会让 terser 把
              `_seek(e)` 分配成 `_seek(t)`），改为按形态匹配，避免无关改动引发假红。

            ### 影响面
            - 纯卡片前端改动 + 发布链改动，**服务端 / HA 集成 / 客户端无需配合升级**。
            - 群组接口需要服务端 ≥ v4.0.16。

            ### 升级步骤
            1. HACS 中更新本卡片（或手动替换 `dist/hass-musicflow-card.js`）
            2. 浏览器 `Ctrl+Shift+R`，或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v${{ steps.ver.outputs.ver }}`
          draft: false
          prerelease: false
