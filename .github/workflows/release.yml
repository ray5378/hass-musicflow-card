name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v2.3.5 — idle 配色扩容到 8 组（新增红/黄/橙）+ 轮换改为每组 7s

            ### 变更
            - **配色由 5 组扩到 8 组**，新增 红 / 黄 / 橙：
              靛蓝 `#4c71c7`/`#317394`、暖褐 `#825232`/`#66542a`、湖青 `#307d98`/`#28786b`、
              黄 `#796811`/`#825913`、藤紫 `#7a42ab`/`#863783`、橙 `#9a5816`/`#a93e24`、
              松墨 `#225441`/`#234b55`、红 `#b2262f`/`#9a3424`。
            - **8 组排成一个环，相邻两组既不撞色相、也不撞明暗**：每段色相差 ≥118°、
              相邻亮度比 ≥1.18×（排列用脚本对 8! 个环穷举择优）。所以每换一组都同时吃到
              「换色 + 换明暗」两重变化，呼吸感比 5 组版更明显。
            - 亮度仍按**相对亮度 Y** 定标：峰 `.175`（靛蓝/湖青）/ `.140`（黄/橙）/
              `.110`（暖褐/藤紫/红）/ 谷 `.070`（松墨），峰值→谷底 **1.88×**。
            - **轮换节奏改为每组停留 7s**（一轮 56s）：`slow` 11.2s / `normal` 7s / `fast` 4.2s
              （一轮 89.6s / 56s / 33.6s）；`off` 仍静止在首组配色。
            - 动效本身不变：仍是整卡对角渐变、原地交叉淡入（`mf-cyc` + 负 `animation-delay`
              错峰），只动 `opacity`，无位移、无重绘、无滤镜。

            ### 注意（设计取舍，非 bug）
            - 红 / 黄 / 橙 受「暗底 + 白字」约束：相对亮度上限 ≈0.183，再亮白字对比度就跌破
              WCAG AA。所以它们呈现为**深红 / 暗金 / 焦橙**，不是明亮原色。
              想更鲜艳必须先牺牲文字可读性。

            ### 兼容性
            - 白字在最亮配色组上的对比度仍有 **4.67:1**（过 WCAG AA 4.5:1），
              idle 态依旧是「暗底浅字」，不会读不清。
            - `idle_background` / `idle_theme` / `idle_speed` 名称与取值不变，无需改配置。
            - `idle_theme` 仍**只**决定强调色（图标 / 进度条 / 选中态）色相，不影响底色。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 `Ctrl+Shift+R` 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v2.3.5`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
