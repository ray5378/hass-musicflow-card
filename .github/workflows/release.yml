name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Remove any pre-existing release for this tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::notice::existing release for ${{ github.ref_name }} found - deleting it so the current notes are applied"
            gh release delete "${{ github.ref_name }}" --yes
          else
            echo "no existing release for ${{ github.ref_name }}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v2.3.9 — 打开媒体库 / 队列时，未播放态底色继续轮换（不再停表）

            ### 修复
            - **问题**：未播放态下打开媒体库（或队列）面板，底层流动底色会**冻住**，必须退出面板才恢复。
            - **根因**：面板是**透明全屏覆盖**（`.panel` 不带背景色，故意「无感」叠在卡片上），未播放态
              下它底下露出的正是这层流动底色；而暂停判定里带了 `showQueue || showBrowser`，于是变成
              「背景可见却被暂停」。播放态有封面时 `.idlebg` 根本不渲染，所以这个别扭只在未播放态暴露。
            - **修复**：暂停判定改为**只看「卡片滚出视口」与「后台标签页」**，打开面板不再停表。
              这是零风险的：该动画只动 `opacity`（跑在合成器线程），每层还有 `contain: layout paint style`
              隔离，不占主线程、与面板滚动无争用 —— 为它停表几乎没有收益，却带来可见的「卡死」观感。

            ### 变更范围
            - `_syncIdleAmbient()` 的 paused 判定：`!visible || hidden || showQueue || showBrowser`
              → `!visible || hidden`。
            - README（中 / 英）里「打开队列 / 媒体库面板时自动停表」的说明同步更新为「不停表」。
            - **未播放态配色 / 环顺序 / 亮度定标 / 关键帧 / 轮换节奏一律未动**，与 v2.3.8 完全一致。

            ### 兼容性
            - 白字在最亮配色组上的对比度仍为 **4.67:1**（过 WCAG AA 4.5:1），idle 态依旧是
              「暗底浅字」，不会读不清。
            - `idle_background` / `idle_theme` / `idle_speed` 名称与取值不变，无需改配置。
            - `idle_speed` 仍是 `slow` 11.2s / `normal` 7s / `fast` 4.2s（一轮 89.6 / 56 / 33.6s）；
              `idle_theme` 仍**只**决定强调色（图标 / 进度条 / 选中态）色相，不影响底色。
            - 关键帧由 JS 注入：若你自定义过卡片样式里写死的 `mf-cyc`，请删掉以免覆盖。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 `Ctrl+Shift+R` 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v2.3.9`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
