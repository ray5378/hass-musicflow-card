name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v2.3.4 — idle 底色：拉开配色亮度差 + 轮换改为每组 5s

            ### 变更
            - **配色反差加大（本次重点）**：上一版 5 组配色几乎等亮（相对亮度 0.081~0.115，
              明暗比只有 1.26×），交叉淡入时只有色相在挪、卡片整体明暗几乎不变，
              所以「呼吸感」很弱。本版把 5 组按**相对亮度 Y** 重新定标并排成「亮度 V 形」：
              峰 `0.175` → 中 `0.110` → 谷 `0.070` → 中 `0.110` → 峰 `0.175`，
              峰值→谷底 **1.88×**。首尾都是峰值，回绕那一下亮度连续，不会硬跳。
            - 新配色（饱和度同步由 ~28% 提到 ~44%~52%）：
              靛蓝 `#4c71c7`/`#317394`、暖褐 `#825232`/`#66542a`、松墨 `#225441`/`#234b55`、
              藤紫 `#7a42ab`/`#863783`、湖青 `#307d98`/`#28786b`。
            - **轮换节奏改为每组停留 5s**（一轮 25s）：`slow` 8s / `normal` 5s / `fast` 3s
              （一轮 40s / 25s / 15s）；`off` 仍静止在首组配色。
            - 动效本身不变：仍是 5 层整卡对角渐变、原地交叉淡入（`mf-cyc` + 负 `animation-delay`
              错峰，5 层 opacity 之和恒为 1），只动 `opacity`，无位移、无重绘、无滤镜。

            ### 兼容性
            - 白字在最亮配色组上的对比度仍有 **4.67:1**（过 WCAG AA 4.5:1），
              idle 态依旧是「暗底浅字」，不会读不清。
            - `idle_background` / `idle_theme` / `idle_speed` 名称与取值不变，无需改配置。
            - `idle_theme` 仍**只**决定强调色（图标 / 进度条 / 选中态）色相，不影响底色。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 `Ctrl+Shift+R` 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v2.3.4`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
