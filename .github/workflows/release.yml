name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v1.6.87 — 极简模式间距 + 暂停去抖延长

            ### 修复
            1. **歌词/标题整体右移 6px**:极简模式 `.wrap` 左侧 padding 14→20px,
               标题与歌词起点右移 6px(封面仍在右缘,位置不变),避免贴左。
            2. **暂停去抖 500ms → 20s**:切歌/短暂暂停(几秒内恢复)极简保持;
               只有真正暂停持续 20 秒才回退完整模式。覆盖各种播放器的切歌空白窗口。

            ### 极简模式最终行为
            - 空闲 3s(可配 `auto_hide_delay`)自动隐藏切换器/控件/进度条,只留 曲名+封面+歌词
            - 歌词 188px 视口,当前行随时间从顶部滑到中段后停住
            - 鼠标移入 / 点击 / 触屏点按 / 键盘焦点 → 立即恢复完整模式
            - 切歌:极简保持,不闪完整模式
            - 暂停:极简保持 20s,持续 20s 才回退完整模式

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 Ctrl+Shift+R 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v1.6.87`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
