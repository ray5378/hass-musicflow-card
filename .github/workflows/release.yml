name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v2.3.7 — idle 配色环起点改为「深红」

            ### 变更
            - **配色环的起点旋转到「深红」**：轮换顺序现为
              深红 → 青绿 → 焦橙 → 湖青 → 暗金 → 靛蓝 → 暖褐 → 藤紫 → 松墨 → 品红 → 草绿 → 烟灰 →(回深红)。
            - **起点只决定「首屏色」，对观感节奏零影响**：环是循环的，旋转起点不改变任何一段相邻
              ΔE —— 12 段的 ΣΔE 恒为 1005、相邻最小 ΔE 恒为 **65.7**（已用 `tools/palette/check.cjs`
              复核）。所以这次只改变「首次进入未播放态时第一眼看到哪个颜色」。
            - 起点取深红，因为它在这条环上彩度最高、色相最正（C\*=63 / h=29°），开场辨识度最高。
            - 红 / 橙 / 黄 三组改名 **深红 / 焦橙 / 暗金**（直接采用它们实际的色相名），README 与
              源码注释同步更新。**12 组色值本身一个都没动。**
            - 亮度定标（峰 `.175` / `.140` / `.110` / `.085` / 谷 `.070`，峰谷 1.88×）、关键帧推导
              （`50/N %` 停留窗，底层漏出 0%）与动效（整卡对角渐变原地交叉淡入、只动 `opacity`，
              无位移 / 无重绘 / 无滤镜）都与 v2.3.6 完全一致。

            ### 注意（设计取舍，非 bug）
            - 深红 / 焦橙 / 暗金 受「暗底 + 白字」约束：相对亮度上限 ≈0.183，再亮白字对比度就跌破
              WCAG AA。所以这三组只能压到这个深度，不是明亮原色。想更鲜艳必须先牺牲文字可读性。

            ### 兼容性
            - 白字在最亮配色组上的对比度仍为 **4.67:1**（过 WCAG AA 4.5:1），idle 态依旧是
              「暗底浅字」，不会读不清。
            - `idle_background` / `idle_theme` / `idle_speed` 名称与取值不变，无需改配置。
            - `idle_speed` 仍是 `slow` 11.2s / `normal` 7s / `fast` 4.2s（一轮 89.6 / 56 / 33.6s）；
              `idle_theme` 仍**只**决定强调色（图标 / 进度条 / 选中态）色相，不影响底色。
            - 关键帧由 JS 注入：若你自定义过卡片样式里写死的 `mf-cyc`，请删掉以免覆盖。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 `Ctrl+Shift+R` 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v2.3.7`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
