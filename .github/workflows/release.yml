name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      # 版本号**只从 tag 解析**,不用 github.ref_name 当版本号:
      # ref_name 在分支推送时等于 "main",直接拿它当版本会把分支名发成版本号。
      # 这里强制必须由 vX.Y.Z 数字 tag 触发,并二次校验三段数字。
      - name: Resolve version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::发布必须由数字版本 tag (vX.Y.Z) 触发,当前 ref=$GITHUB_REF(拒绝 main/分支名版本)"
            exit 1
          fi
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' 不是数字版本号(vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "::notice::本次发布版本 $tag"

      - name: Remove any pre-existing release for this tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::existing release for $RELEASE_TAG found - deleting it so the current notes are applied"
            gh release delete "$RELEASE_TAG" --yes
          else
            echo "no existing release for $RELEASE_TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            ## MusicFlow 卡片 ${{ steps.ver.outputs.tag }} — 进度条小圆点跟随修复

            本版修复：**拖动 / 点击进度条之后，填充条继续前进，但小圆点永远停在手指松开的位置**。

            ### 根因
            进度条写的是 `<input type="range" value="${prog}">` —— 这是**属性**绑定，属性只写
            `defaultValue`。按 HTML 规范，`value` 内容属性**仅在脏值标志（dirty value flag）为假时**
            才同步到控件的当前值，而 range 一经用户交互（拖动 / 点击）就会置位该标志 ⇒ 此后所有
            属性写入被忽略，小圆点冻结；填充条走的是内联 `style` 渐变（不受脏值标志影响）
            ⇒ 两者分道扬镳，现场即「填充条在动、小圆点留在原地」。

            真实 Chromium 实测三连（本次回归的证据链）：

            | 场景 | 结果 |
            | --- | --- |
            | 全新元素 + 只改属性 60 | `value=60`（首次渲染本来就生效 → 平时看不出问题） |
            | 拖过一手 + 改属性 60 | `value=40`（**失效 = 事故现场**） |
            | 拖过一手 + 改 property 60 | `value=60`（改用 property 即恢复） |

            ### 本版改动
            - 渲染后按 **property** 把同一个进度百分比回写给小圆点，填充与圆点恒同源
              （新增 `_progressPct()` 收敛为唯一来源，`_syncSeekThumb()` 负责回写）。
            - 拖拽中不回写（手指即权威，避免与指针抢位）；拖拽结束立刻重渲染一次，
              圆点立即对齐权威值，不留「停在手指处」的窗口。
            - 新增 CI 契约守卫规则 8：**进度圆点必须按 property 回写且与填充条同源**
              （`tools/guard-seek-contract.mjs`，同时校验 `src` 与已提交的 `dist`）。
            - 诊断开关（`localStorage.mf_log_level = debug`）下可见一行「进度圆点回写」，
              仅当圆点与期望值差值 >1% 时打出，正常跟随不刷屏。

            ### 影响面
            - 纯前端显示层修复：**服务端 / HA 集成 / 客户端无需任何改动**，seek 下发与去抖逻辑未变。
            - 音量滑轨不受影响（它由 `style="left:…%"` 驱动，本来就是同源绘制）。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 `Ctrl+Shift+R`，或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v2.4.9`
          draft: false
          prerelease: false
