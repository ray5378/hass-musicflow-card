name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      # 版本号**只从 tag 解析**,不用 github.ref_name 当版本号:
      # ref_name 在分支推送时等于 "main",直接拿它当版本会把分支名发成版本号。
      # 这里强制必须由 vX.Y.Z 数字 tag 触发,并二次校验三段数字。
      - name: Resolve version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::发布必须由数字版本 tag (vX.Y.Z) 触发,当前 ref=$GITHUB_REF(拒绝 main/分支名版本)"
            exit 1
          fi
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' 不是数字版本号(vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "::notice::本次发布版本 $tag"

      - name: Remove any pre-existing release for this tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::existing release for $RELEASE_TAG found - deleting it so the current notes are applied"
            gh release delete "$RELEASE_TAG" --yes
          else
            echo "no existing release for $RELEASE_TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            ## MusicFlow 卡片 ${{ steps.ver.outputs.tag }} — 补齐单元测试与覆盖率门禁

            本版为**质量加固版**：卡片侧新增 vitest 单元测试、四维覆盖率硬门禁与阻塞式 CI，
            并补齐被忽略的构建产物。**卡片功能与界面行为无变化。**

            ### 新增：单元测试 + 覆盖率门禁
            - 新增 `vitest` 单测（happy-dom 环境）：覆盖后端客户端（直连 / 代理、REST / WS、
              封面缓存）、本地化与语言包、i18n 键位一致性、卡片主逻辑。
            - 新增四维覆盖率门禁（语句 / 分支 / 函数 / 行，阈值 60%），以独立 `Unit Tests`
              workflow 阻塞合并；覆盖率不达标直接判红。
            - 既有 4 个守卫（Card UI 契约 / Client Link / Seek Contract / Version Guard）保持全绿。

            ### 其他
            - `.gitignore` 忽略 vitest 生成的 `coverage/` 目录，避免产物误入版本库。

            ### 影响面
            - 纯测试 / 工程配置改动，**卡片运行时行为、HACS 安装方式与配置项均无变化**。
            - 服务端 / HA 集成 / 客户端无需配合升级。

            ### 升级步骤
            1. HACS 中更新本卡片（或手动替换 `dist/hass-musicflow-card.js`）
            2. 浏览器 `Ctrl+Shift+R`，或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v${{ steps.ver.outputs.ver }}`
          draft: false
          prerelease: false
