name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v2.1.1 — 未播放态光斑「看得见了」

            ### 问题
            v2.1.0 的流动底色反馈「有，但不明显」。根因是几何参数：三个光斑的 `inset` 都是 `-30%`
            （直径 = 卡宽 **160%**），而且**三斑完全重合** —— 卡片里只能看到光斑中心那一小块几乎均匀的
            平台区，既没有轮廓也没有流动感；再叠加漂移仅 ±9%，整体就只剩「色调在缓慢变化」。

            ### 调整
            | 项 | v2.1.0 | v2.1.1 |
            |---|---|---|
            | 光斑直径 | 160% 卡宽（比卡还大） | **70% 卡宽** |
            | 三斑布局 | 完全重合 | **各占一角**（−18/−12、+16/+10、−4/+20） |
            | 漂移幅度 | ±9% | **±18%** |
            | 呼吸缩放 | 1 → 1.25 | **1 → 1.35** |
            | 明暗呼吸 | 0.55 → 1 | **0.35 → 1** |
            | 饱和度 | 1.0× | **1.25×** |
            | 明度差 | 与底色差 ~0.17 | **再拉开 0.06**（暗色主题提亮 / 亮色主题压暗） |

            - 光斑改为正圆（`aspect-ratio: 1`），不再随卡片宽高比被拉成椭圆。
            - 亮度调整分明暗两路：暗色主题光斑本就比底色亮所以继续提亮；
              **亮色主题光斑比底色暗，必须反向压暗**，否则越调越平。
            - 无障碍降级（`prefers-reduced-motion`）时动画停在第 0 帧，此前透明度只有 0.35 偏暗，
              现显式提到 0.8，静态状态下同样看得见。
            - 性能约定不变：仍然只动画 `transform` / `opacity`，合成线程驱动，无 `filter` / JS 逐帧。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 Ctrl+Shift+R 或 Lovelace「重新加载资源」清掉卡片缓存
            3. F12 Console 确认 `[musicflow-remote-card] v2.1.1`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
