name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v1.6.85 — 极简模式三处微调

            ### 修复
            1. **歌词从顶部开始,高亮随时间下滑到中段**:之前 `curSlot` 固定为 4,歌曲开头第一句
               也被放在中间(第 5 槽),前 4 行空着。改为 `curSlot = min(lyricIndex, 4)`,开头
               从顶部铺,高亮自然从 y=0 一路滑到 y=80 后停住。
            2. **极简模式歌词居中**:宽卡片里左对齐歌词视觉重心偏左。极简模式下歌词
               `text-align: center`(标题仍左对齐与封面呼应)。
            3. **切歌不退出极简模式**:之前 `_resetIdleTimer` 在 `canMini()=false` 时强制退出
               mini,切歌瞬间 `isPlaying` 短暂 false 就会让整卡闪回完整模式。改为
               `_resetIdleTimer` 不再强制退出,只在 `_updatedMiniWatch` 里显式处理
               "暂停"和"打开队列/媒体库"两种真该退出的场景。切歌时 mini 状态保持。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 Ctrl+Shift+R 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v1.6.85`
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
