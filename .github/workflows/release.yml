name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      # 版本号**只从 tag 解析**,不用 github.ref_name 当版本号:
      # ref_name 在分支推送时等于 "main",直接拿它当版本会把分支名发成版本号。
      # 这里强制必须由 vX.Y.Z 数字 tag 触发,并二次校验三段数字。
      - name: Resolve version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::发布必须由数字版本 tag (vX.Y.Z) 触发,当前 ref=$GITHUB_REF(拒绝 main/分支名版本)"
            exit 1
          fi
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' 不是数字版本号(vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "::notice::本次发布版本 $tag"

      - name: Remove any pre-existing release for this tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::existing release for $RELEASE_TAG found - deleting it so the current notes are applied"
            gh release delete "$RELEASE_TAG" --yes
          else
            echo "no existing release for $RELEASE_TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            ## MusicFlow 卡片 ${{ steps.ver.outputs.tag }} — 媒体库首页打开提速（不再「卡片出来了、封面迟迟不显示」）

            本版把卡片**媒体库首页**的取数由「5 路请求齐等」改为**两阶段加载**：卡片一出来
            就先渲染顶部固定卡与侧栏随机歌单，平台精选 / 本地随机在后台到达后**就地补齐**。

            ### 优化：媒体库首页两阶段加载
            - 现象：打开卡片媒体库首页时，卡片骨架/文字先出来，封面却迟迟不显示、
              整个首页要等 2~3 秒才成形。
            - 根因：`_fetchHomeItems` 把 5 路请求塞进一个 `Promise.all` **齐等** ——
              歌单 / 固定卡计数 / 固定卡（快）与平台精选 / 本地随机（冷启动 2.5s+）
              一起 await，慢两路不回就整屏不出。
            - 修复：
              - **阶段一**只 await 快三路，顶部固定卡 + 侧栏随机**立即渲染**；
              - **阶段二**把慢两路另起一个**非 await** 的 `Promise.all`，在 `.then` 里经
                `_appendHomeSections` 追加到列表尾，复用虚拟滚动「失效首块 + 重载」就地
                补齐 —— 不白屏、不整页重载；
              - 慢两路回包**比对 `vSeq` 序号**，期间切 agent / 刷新 / 搜索即丢弃旧回包，
                绝不覆盖新状态；
              - 首屏**前 8 行**封面 `fetchpriority=high`，其余保持 `loading=lazy`，
                让首屏可见的 8 张先抢到连接。
            - 聚合顺序与字段与旧版**逐字节一致**（固定卡 → 侧栏随机 → 平台精选 → 本地随机）。

            ### 影响面
            - 纯卡片前端改动，**服务端 / HA 集成 / 客户端无需配合升级**。
            - 建议配合服务端 ≥ v4.6.42（该版把首页聚合缓存预热提前到启动后约 4s，并给
              平台精选 / 本地随机加了指数退避），卡片首开更快。

            ### 升级步骤
            1. HACS 中更新本卡片（或手动替换 `dist/hass-musicflow-card.js`）
            2. 浏览器 `Ctrl+Shift+R`，或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v${{ steps.ver.outputs.ver }}`
          draft: false
          prerelease: false
