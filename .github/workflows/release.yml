name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v1.6.83 — 极简歌词模式修复(音量面板 + 版本核对)

            v1.6.82 修复后仍有问题:音量面板打开时控件仍不隐身。真凶是 CSS `:focus-within`
            (visibility:visible !important)——点音量按钮后按钮获得焦点,该规则把音量面板的
            `volmode` 隐身规则顶掉了。

            本次改为 JS `focusin/focusout` 处理键盘可达性(焦点在卡片内时恢复完整模式并暂停
            空闲隐藏),不再用 CSS 强制 visibility,音量面板恢复原行为。

            ### 修复
            - 移除 CSS `:focus-within` 强制规则,改为 JS focusin/focusout(不干扰 volmode)
            - 焦点在卡片内(如 Tab 到进度条)时保持完整模式,不进入极简;焦点离开后恢复空闲隐藏
            - 新增控制台版本标记:打开浏览器开发者工具(F12)→ Console,可看到
              `[musicflow-remote-card] v1.6.83`,用于核对实际加载的版本

            ### 排查"更新了但没变化"的缓存问题
            1. HACS 更新本卡片后,在浏览器按 **Ctrl+Shift+R** 强制刷新
            2. 或 Lovelace 仪表盘「编辑 → ⋮ → 重新加载资源」
            3. 打开 F12 Console,确认看到 `[musicflow-remote-card] v1.6.83`(旧版本号=还在用缓存)

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 按上述缓存步骤重载,确认 Console 版本号为 v1.6.83
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
