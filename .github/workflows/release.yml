name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Remove any pre-existing release for this tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::notice::existing release for ${{ github.ref_name }} found - deleting it so the current notes are applied"
            gh release delete "${{ github.ref_name }}" --yes
          else
            echo "no existing release for ${{ github.ref_name }}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## MusicFlow 卡片 ${{ github.ref_name }} — 拖拽 seek 整秒契约

            本版修复：**在卡片上拖动进度条之后，远端播放会静默死掉、进度冻住**。

            ### 根因
            服务端 sendspin 流式引擎按 **25ms 帧栅格**取帧，而滑动窗口基准是「毫秒 → 样本」换算，
            **只有目标为 25ms 整数倍时两者严格相等**。卡片此前把「当前播放位置」原样下发
            （31.178s 这类毫秒精度）→ 取帧起点落在窗口基准之前 → 子进程进入纯微任务自旋
            （不 await I/O）→ 事件循环饿死 → 心跳与 poll RPC 全排不上队 → **65s 看门狗 SIGKILL**。
            客户端下发的是整秒（`Duration.inSeconds`），所以**从来只有卡片与网页会挂**。

            ### 本版改动
            - 拖动目标统一**向下取整到整秒**（`SEEK_GRANULARITY_SEC = 1`），与客户端同语义
              （代价 ≤999ms，不可闻）；乐观位置与下发值同源，避免轮询一回就把进度条拽回去。
            - 新增 CI 契约守卫：**任何含拖拽的仓库，下发精度不得小于 1 秒**
              （`tools/guard-seek-contract.mjs` 规则 7，同时校验 `src` 与已提交的 `dist`）。

            ### 配套
            - **MusicFlow 服务端 v4.0.12+**：引擎三层防御（帧栅格对齐 / 亚帧容错 / 淘汰护栏）
              + `POST /v1/peers/:id/seek` 唯一入口兜底 —— 非整秒目标不再可能送进引擎。
            - **MusicFlow 客户端 v5.0.28+**、**HA 集成 v2.0.5+**：同一批次对齐发布。
            - 卡片侧读取位置 / 拖动去抖（250ms trailing）逻辑未变，**无需重新配置**。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 `Ctrl+Shift+R`，或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v2.4.8`
          draft: false
          prerelease: false
