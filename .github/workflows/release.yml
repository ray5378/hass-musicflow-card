name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v1.6.82 — 极简歌词模式修复

            v1.6.81 极简模式下两个显示问题修复:
            1) 歌词视口设到 192px,250px 卡片装不下,歌词溢出底部并盖到进度条
            2) `not-mini` 规则带 `visibility:visible`,优先级压过了原音量面板的 `volmode` 隐藏规则,
               导致音量面板打开时控件不再隐身

            本次修正:歌词视口收到 **146px**(约 7 行,250px 卡片内能装下的最大可用高度,再高
            会越过进度条造成溢出),并删掉多余的 `visibility:visible`,音量面板恢复原行为。

            ### 修复
            - 歌词视口 100px → 146px(约 7 行),当前行槽位 3(7 行视口的中段居中)
            - 音量面板(`.lower.volmode`)打开时,控件行与进度条恢复 `visibility:hidden` 隐身

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 仪表盘「编辑 → ⋮ → 重新加载资源」或直接刷新页面,使新 JS 生效
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
