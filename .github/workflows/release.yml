name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build card & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist is committed and up to date
        run: |
          git diff --exit-code dist/hass-musicflow-card.js || {
            echo "dist/hass-musicflow-card.js is stale - run 'npm run build' and commit it before tagging.";
            exit 1;
          }

      - name: Remove any pre-existing release for this tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::notice::existing release for ${{ github.ref_name }} found - deleting it so the current notes are applied"
            gh release delete "${{ github.ref_name }}" --yes
          else
            echo "no existing release for ${{ github.ref_name }}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## v2.4.2 — 修复遥控客户端实例时音量 / 播放态被滞后上报顶回

            本版只改 **MusicFlow 客户端本机实例（安卓 / Windows）** 这一条链路；
            DLNA / AirPlay / Sendspin / 群组的显示与控制行为与 v2.4.0 完全一致。

            ### 修复
            - **歌名恒「未知」、封面不渲染**：客户端实例的 `GET /peers/:id/status` 只回
              `media: { songId }`（标题 / 艺人 / 专辑 / 封面 / 时长都在同一响应的队列快照 `items` 里）。
              卡片此前直接拿这份薄 `media` 渲染，于是标题走「未知」兜底、封面为空。
              现在用 `status.items[currentIndex]` 把它补全成完整媒体信息；
              若游标不可用（队列行未激活 / 越界）则按客户端上报的 `songId` 反查当前项兜底。
            - **进度 / 歌词"前进一段又回退"**：客户端上报的 `position` 是**周期性采样**（实测约 4s 一次），
              采样时刻由 `reportedAt` 给出。卡片每 2s 轮询却把采样值当"此刻"直接写入，
              于是每两轮就把本地已在推进的时钟拽回旧值（回退幅度 = 一个上报周期，约 2~4s，**不是固定 2 秒**）。
              现在按 `position + (现在 − reportedAt)` 外推到此刻再写入，两次上报之间连续推进。
              暂停时不做外推（保持上报值，避免暂停态漂移）。
              > 仅客户端实例的 status 带 `reportedAt`；设备型 peer 走实时查询、无该字段，行为不变。
            - **拖动进度条后位置又跳回**：同上成因 —— seek 后客户端要等下一个上报周期才回新位置，
              期间轮询读到的仍是 seek 之前的采样，会先把进度条拽回原位。现在记录本卡片发起 seek 的时刻，
              在 6s 窗口内丢弃"采样早于该 seek"的上报，等客户端回新值再对齐。

            - **拖动音量会被顶回上一拍**（如 20 → 50 → 30，结果跳回 50）：
              音量 / 静音与 `position` 一样是客户端**周期性上报**的值（实测约 4s 一次）。
              卡片原先只在**拖拽过程中**忽略服务器回传，拖拽刚结束的那一两轮仍会采纳
              「命令之前采样」的旧值，于是把手上刚设定的音量顶回上一拍。
              现在新增统一的陈旧采样判据 `_isStaleSample`：采样时刻（`reportedAt`）早于
              命令下发时刻、且仍在 8s 保护窗口内 → 忽略该字段；等上报追上命令后自动恢复采纳。
              打点时刻取**真正发出请求的那一刻**（含 120/150ms 防抖），窗口不会提前失效。
            - **点了暂停又自己播起来**：暂停后轮询读到的仍是 `state=PLAYING` 且 `position` 在前进，
              会触发卡片「position 前进 → 判在播」的自愈，把 `PAUSED` **改回 `PLAYING`**。
              现在在保护窗口内停用该自愈，并沿用在地已乐观翻转的播放态。

            ### 配置语义
            - 无新增 / 变更的卡片配置项，`idle_background`、配色、透明全屏等既有选项语义不变。

            ### 升级步骤
            1. HACS 中更新本卡片
            2. 浏览器 `Ctrl+Shift+R` 或 Lovelace「重新加载资源」
            3. F12 Console 确认 `[musicflow-remote-card] v2.4.2`

            ### 配套
            - 服务端 v3.0.21+ / 客户端 v5.0.4+（客户端实例要出现在列表里，需要它在服务端注册且在线）。
          files: dist/hass-musicflow-card.js
          draft: false
          prerelease: false
